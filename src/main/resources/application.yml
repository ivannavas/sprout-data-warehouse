spring:
  application:
    name: sprout-data-warehouse

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sprout_data_warehouse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
  model:
    name: ${ANTHROPIC_MODEL:claude-opus-4-8}
  max:
    tokens: 8192
  timeout:
    seconds: 300

voyage:
  api:
    key: ${VOYAGE_API_KEY:}
  embedding:
    model:
      name: ${VOYAGE_EMBEDDING_MODEL:voyage-3}
  timeout:
    seconds: 300

pgvector:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/sprout_data_warehouse}
  username: ${DB_USERNAME:postgres}
  password: ${DB_PASSWORD:postgres}
  table: sprout_documents
  dimension: 1024

daily:
  transcriptions:
    path: ${DAILY_TRANSCRIPTIONS_PATH:C:/audio-diary}

logging:
  level:
    io.github.ivannavas: INFO
